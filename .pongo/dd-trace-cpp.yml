services:
  # Volume mount service - immediately healthy
  dd-trace-cpp:
    image: alpine:latest
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s
    restart: "no"
  
  # Add volume mount to kong service.
  # Set DD_TRACE_CPP_DIR to the path of your local dd-trace-cpp checkout.
  # Example: export DD_TRACE_CPP_DIR=$HOME/dd/dd-trace-cpp
  kong:
    volumes:
      - ${DD_TRACE_CPP_DIR:?Set DD_TRACE_CPP_DIR to your local dd-trace-cpp checkout}:/dd-trace-cpp
