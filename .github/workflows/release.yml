name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Retrieve version
        id: version
        run: |
          HANDLER_VERSION="$(grep 'VERSION' kong/plugins/ddtrace/handler.lua | awk -F '"' '{print $2;exit}')"
          echo "version=${HANDLER_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Ensure tag matches the handler version
        env:
          HANDLER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "v${HANDLER_VERSION}" != "$GITHUB_REF_NAME" ]]; then
            echo "version mismatch: ${HANDLER_VERSION} != ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

  build-rock:
    needs: prep
    uses: ./.github/workflows/build-rock.yml
    with:
      publish-mode: release
      version: ${{ needs.prep.outputs.version }}
      tag: ${{ github.ref_name }}
    secrets:
      LUAROCKS_KEY: ${{ secrets.LUAROCKS_KEY }}
